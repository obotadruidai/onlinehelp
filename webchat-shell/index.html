<!DOCTYPE html>
<html lang="en">
<head>

    <title>Druid AI Docs</title>
    <link rel="stylesheet" href="https://prod-druid-apc.azureedge.net/v2/druid_webchat_v2.css">

        html, body {
            margin: 0;
            height: 100%;
            font-family: sans-serif;
        }
        header {
            height: 60px;
            box-sizing: border-box;
            background: #1e1e1e;
            color: #fff;

            align-items: center;
            padding: 0 20px;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;

        iframe {

            width: 100%;
            height: calc(100% - 60px);

        }

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            DruidWebchat_v2.init({
                botId: "2ae61f2a-e12d-4ef2-c883-08d942b1c484",
                baseUrl: "https://druidapi.druidplatform.com",
                queryParams: ""
            });
        });
    </script>

</html>
